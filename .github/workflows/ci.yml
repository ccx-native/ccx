name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes cancel; every push to main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Ruff
        # Rules live in pyproject.toml [tool.ruff.lint]; the version is pinned
        # so a new ruff release cannot turn CI red on its own.
        run: |
          python -m pip install --quiet ruff==0.17.1
          ruff check .

  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      # Belt-and-braces with tests/conftest.py: never reach a real agent binary.
      CCX_CLAUDE_BIN: /nonexistent/claude
      CCX_CODEX_BIN: /nonexistent/codex

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # ccx itself has no runtime dependencies (pyproject `dependencies = []`),
        # so the only thing the public suite needs is pytest.
        run: python -m pip install --upgrade pip pytest pytest-xdist

      - name: Byte-compile the package
        run: python -m compileall -q ccx examples ccx.py

      - name: Run public test suite
        # Quota-free: fake Claude/Codex providers, no logins or network.
        # Includes test_package_metadata: version sync, scripts, zero runtime deps.
        run: python -m pytest tests/ -q -n auto --dist worksteal

  package:
    name: package (build + wheel smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist

      - name: Assert no internal files in the sdist
        run: |
          ! tar tzf dist/*.tar.gz | grep -E 'MEMO-|BUGREPORT-|\.zip$|/private/|/\.claude/|/CLAUDE\.md$|/AGENTS\.md$|/tests/evidence/'

      - name: Wheel install smoke
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          export HOME="$(mktemp -d)"
          /tmp/smoke/bin/ccx --version
          /tmp/smoke/bin/ccx --help >/dev/null
          /tmp/smoke/bin/ccx skills install --dir "$HOME/skills"
          test -f "$HOME/skills/ccx/SKILL.md"

  sanity:
    name: sanity (npm pack + doc links)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: npm pack --dry-run
        run: npm pack --dry-run

      - name: Doc links
        run: python3 scripts/check_doc_links.py
